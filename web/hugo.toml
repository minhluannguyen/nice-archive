
baseURL = "https://minhluannguyen.github.io/nice-archive/"
languageCode = "en-us"
title = "NICE Archive"
theme = "hugo-book"

[params]
  BookTheme = "light"
  BookSection = "docs"
  BookSearch = true
  BookComments = false
  BookRepo = "https://github.com/minhluannguyen/nice-archive"
  BookPortableLinks = "warning"

# Keep documentation in the existing repository docs/ directory.
[[module.mounts]]
  source = "content"
  target = "content"

[[module.mounts]]
  source = "../docs"
  target = "content/docs"
  files = [
    "! agents/**",
    "! CVE_ORCHESTRATOR_README.md",
    "! README.md",
  ]

