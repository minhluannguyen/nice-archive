name: Report tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Only default-branch runs write the shared hestia cache; never cancel them.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  discover-reports:
    name: Discover report flakes
    runs-on: ubuntu-latest
    outputs:
      reports: ${{ steps.reports.outputs.reports }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Collect reports
        id: reports
        run: |
          reports="$(python - <<'PY'
          import json
          from pathlib import Path

          report_dirs = {
              path.parent
              for pattern in ("*/flake.nix", "*/default.nix")
              for path in Path("cves").glob(pattern)
          }
          paths = sorted(str(path) for path in report_dirs)
          print(json.dumps(paths))
          PY
          )"
          echo "reports=${reports}" >> "${GITHUB_OUTPUT}"

  report-tests:
    name: ${{ matrix.report }}
    needs:
      - discover-reports
    if: ${{ needs.discover-reports.outputs.reports != '[]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      actions: read # lets hestia detect evicted cache entries upfront
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        report: ${{ fromJson(needs.discover-reports.outputs.reports) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Cache Nix store (hestia)
        uses: Mic92/hestia@v3.1.0
        with:
          version: v3.1.0
          # Paths signed by cache.nixos.org are refetched from there instead
          # of spending the repository's 10 GB cache quota on them.
          upstream-cache-filter: true

      - name: Build and run vulnerable test
        run: |
          ref="./${{ matrix.report }}"
          if [ -f "$ref/flake.nix" ] && \
             nix eval "$ref#build-test-vulnerable-true-x86_64-linux.drvPath" >/dev/null 2>&1; then
            # Cacheable test derivation: building it runs the VM once; a later
            # cache hit (hestia) substitutes the result without rerunning.
            nix build "$ref#build-test-vulnerable-true-x86_64-linux" --print-build-logs
          elif [ -f "$ref/flake.nix" ]; then
            # Old-kernel cases expose only a runnable driver (not cacheable).
            nix run "$ref#test-vulnerable-true-x86_64-linux" --print-build-logs
          elif [ -f "$ref/default.nix" ]; then
            nix-build "$ref/default.nix" -A testVulnerableTrue
            ./result/bin/nixos-test-driver
          fi
